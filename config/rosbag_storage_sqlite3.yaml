# Crash-safe sqlite settings for every recording writer (ros2 bag record
# subprocesses and the in-process image writers).
#
# rosbag2's sqlite defaults trade durability for speed (journal_mode=MEMORY,
# synchronous=OFF): a power cut mid-recording leaves the whole .db3
# "database disk image is malformed" (observed 2026-07-10, recoverable only
# via sqlite3 .recover). WAL + synchronous=NORMAL survives power loss --
# at most the last unsynced transactions are lost -- and WAL writes are
# faster than a rollback journal for this append-only workload.
write:
  pragmas: ["journal_mode = WAL", "synchronous = NORMAL"]
