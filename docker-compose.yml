# jetson-nx branch: COLMAP (CUDA sm_87, for Orin NX) and the
# looper-vio-colmap-handoff pipeline it feeds are compiled/cloned into the
# image itself (see Dockerfile's colmap-builder stage) -- no host mounts,
# no per-device custom-compiled binaries. /optimization works out of the
# box after `docker compose build`. This branch does not support Nano.
services:
  insight-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      network: host    # Jetson iptables raw table workaround
    image: insight-dashboard:latest
    container_name: insight-dashboard

    # ── ROS2 requires host network for DDS multicast ─────────────────────────
    network_mode: host

    # ── NVIDIA Container Runtime for CUDA acceleration ───────────────────────
    runtime: nvidia

    # Docker's 64MB default /dev/shm is too small for the kiosk browser's
    # GPU process (open_web_3d_right.sh): its
    # command-buffer ring allocation fails silently and the WebGL canvas
    # never renders, both with real GPU (context-loss loop) and swiftshader
    # (AllocateRingBuffer failures). tmpfs, so this only costs memory if
    # actually used -- bump further if still flaky, bounded by host RAM
    # (`free -h`).
    shm_size: '2gb'

    environment:
      - ROS_DOMAIN_ID=20           # Must match devices; override in .env if needed
      # Base image defaults to Etc/UTC. Without this, rosbag names
      # (insight_record_YYYYMMDD_HHMMSS, from time.strftime -> localtime)
      # and container log timestamps are 8h behind actual wall-clock time
      # on a China-based host, which reads as "wrong" until you remember
      # the offset. tzdata is already in the image (see Dockerfile).
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      # For `run_dashboard.sh --jetson` (docker exec ... open_web_3d_right.sh):
      # The kiosk browser is installed inside this image, so the kiosk window
      # runs via `docker exec`, which
      # needs DISPLAY + the X11 socket below to reach the host's X server.
      - DISPLAY=${DISPLAY:-:0}
      # Uncomment to override default port:
      # - DASHBOARD_PORT=8765

    volumes:
      # ── Source code (live-mounted; no rebuild needed for code changes) ─────
      # /workspaces/looper-vio-colmap-handoff (a sibling, not under this
      # path) and the COLMAP binary are baked into the image, not part of
      # this mount, so this doesn't shadow either of them. NOTE: do NOT add
      # a /usr/local/cuda host mount here -- COLMAP is linked against the
      # CUDA runtime baked into the image (Dockerfile), and bind-mounting
      # the host's own CUDA over it would shadow that with whatever happens
      # to be on this specific host, silently breaking on any other device.
      - .:/workspaces/insight_capture

      # X11 socket for the on-device kiosk window (--jetson). Plain `docker
      # compose` doesn't get VS Code Dev Containers' automatic X11
      # forwarding, so this has to be explicit here.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # SSH keys for rosbag remote sync (optional; remove if not using sync).
      # ${HOME} resolves from the shell that runs `docker compose`, not a
      # hardcoded username, so this works regardless of who's deploying.
      - ${HOME}/.ssh:/root/.ssh:ro

    restart: unless-stopped

    # ── Resource limits ──────────────────────────────────────────────────────
    # This host has exactly 6 cores. Leave a thin 0.2-core reservation for the
    # host OS/sshd/dockerd -- not for ROS2's sake (that runs in here), but so
    # a runaway process *inside* this container (rosbag record, a leftover
    # test browser, anything) can't fully starve the host and lock out SSH.
    deploy:
      resources:
        limits:
          cpus: '5.8'
