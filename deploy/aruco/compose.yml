services:
  aruco-capture:
    build:
      context: ../..
      dockerfile: deploy/aruco/Dockerfile
      network: host
    network_mode: host
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ARUCO_DEVICE_ROOT: /host-dev
    device_cgroup_rules:
      - "c 81:* rw"
      - "c 188:* rw"
      - "c 166:* rw"
    volumes:
      - /dev:/host-dev:ro
      - ../../config/devices/x86-aruco/capture.json:/app/config/devices/x86-aruco/capture.json
      - ../../outputs:/app/outputs
