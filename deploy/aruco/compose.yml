services:
  aruco-capture:
    build:
      context: ../..
      dockerfile: deploy/aruco/Dockerfile
    network_mode: host
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ARUCO_DEVICE_ROOT: /host-dev
      # Pre-annotation service (insight_capture.vlm_service), e.g. http://10.198.1.220:8780;
      # set it in deploy/aruco/.env. Empty: recordings are not pre-annotated.
      ARUCO_ANNOTATION_URL: ${ARUCO_ANNOTATION_URL:-}
    device_cgroup_rules:
      - "c 81:* rw"
      - "c 188:* rw"
      - "c 166:* rw"
    volumes:
      - /dev:/host-dev:ro
      - ../../config/devices/x86-aruco/capture.json:/app/config/devices/x86-aruco/capture.json
      - ../../outputs:/app/outputs
