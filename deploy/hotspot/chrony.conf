# Capture clock authority: never import WAN/DHCP time during acquisition.
# Set absolute UTC from a trusted clock only during idle maintenance, then
# restart camera acquisition so hardware-to-epoch mappings use the same base.
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
rtcsync
local stratum 10
allow 169.254.10.0/24
allow 169.254.20.0/24
allow 169.254.30.0/24
allow 169.254.40.0/24
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
