interface=capture_ap
bind-dynamic
no-resolv
no-hosts
domain-needed
local=/capture.local/
address=/capture.local/10.77.0.1
dhcp-range=10.77.0.20,10.77.0.200,255.255.255.0,12h
# No default gateway: this network reaches only the capture device.
dhcp-option=3
dhcp-option=6,10.77.0.1
dhcp-leasefile=/var/lib/misc/insight-capture.leases
