<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Insight Dashboard Settings</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-dashboard-view="settings">
    <div class="shell shell-page">
      <header class="page-header">
        <div>
          <div class="camera-page-eyebrow">INSIGHT</div>
          <h1>Settings</h1>
          <p class="page-copy">Camera avatars and gripper tracking apply immediately.</p>
        </div>
        <nav class="page-nav" aria-label="Dashboard pages">
          <a href="/3d">3D</a>
          <a href="/images">Images</a>
          <a href="/recording">Recording</a>
          <a href="/bags">Bags</a>
          <a href="/scoring">Scoring</a>
          <a href="/optimization">Optimization</a>
          <a href="/settings" aria-current="page">Settings</a>
        </nav>
      </header>

      <div id="settings-restart-banner" class="settings-restart-banner" hidden>
        <span id="settings-restart-message">Saved. Restart the backend to apply.</span>
        <button type="button" id="settings-restart-button" class="recording-button recording-button-secondary">Restart backend now</button>
      </div>

      <main class="settings-page-panel recording-panel" id="settings-panel">
        <p class="eyebrow">Cameras</p>
        <p id="settings-status" class="record-topic-status" aria-live="polite">Loading settings...</p>
        <div id="settings-camera-list" class="settings-camera-list"></div>
      </main>

    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
