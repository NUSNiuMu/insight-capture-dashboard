<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Insight 3D Workspace</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260729-compositor-lite">
    <script src="/static/babylon.js"></script>
    <script src="/static/babylonjs.loaders.min.js"></script>
  </head>
  <body data-dashboard-view="3d">
    <div class="studio-shell">
      <aside class="studio-rail" aria-label="Workspace navigation">
        <a class="rail-brand" href="/3d" aria-label="Insight home"><span class="brand-mark">I</span></a>
        <nav class="rail-nav">
          <a href="/3d" class="is-active" data-short="3D" title="Spatial view">Spatial view</a>
          <a href="/recording" data-short="RC" title="Recording">Recording</a>
          <a href="/bags" data-short="BG" title="Rosbags">Rosbags</a>
          <a href="/umi-dataset" data-short="UM" title="UMI dataset">UMI dataset</a>
          <a href="/scoring" data-short="SC" title="Scoring">Scoring</a>
          <a href="/handpose" data-short="HP" title="Hand pose">Hand pose</a>
          <a href="/optimization" data-short="OP" title="Optimization">Optimization</a>
          <a href="/settings" data-short="ST" title="Settings">Settings</a>
        </nav>
        <div class="rail-online" title="System online"><span></span></div>
      </aside>

      <main class="spatial-stage">
        <aside class="spatial-cameras">
          <header class="camera-wall-heading">
            <div><p class="section-kicker">Live monitor</p><h2>Camera wall</h2></div>
            <span><i></i> LIVE</span>
          </header>
          <div class="camera-dock spatial-camera-dock" id="camera-dock"></div>
        </aside>

        <section class="scene-viewport">
          <canvas id="render-canvas"></canvas>

          <div class="hud">
            <section class="spatial-playback" id="playback-panel">
              <div class="spatial-playback-copy">
                <p class="section-kicker">Rosbag playback</p>
                <strong id="playback-status">Idle</strong>
              </div>
              <div class="playback-row">
                <select id="playback-bag-select" class="field-control" data-bag-select aria-label="Playback rosbag"></select>
                <button type="button" id="start-playback-button" class="primary-button">Play</button>
                <button type="button" id="stop-playback-button" class="danger-button" hidden>Stop</button>
                <button type="button" id="go-live-button" class="quiet-button" hidden>Go live</button>
              </div>
            </section>
            <section class="mapping-panel" id="mapping-panel">
              <div class="mapping-copy">
                <p class="section-kicker">Global sparse mapping</p>
                <h2 id="mapping-status">Mapping unavailable</h2>
                <p id="mapping-meta" class="mapping-meta">Waiting for the TensorRT mapping services</p>
                <div class="mapping-camera-states" id="mapping-camera-states"></div>
              </div>
              <div class="mapping-actions">
                <button type="button" id="clear-trajectory-button" class="quiet-button">Clear trail</button>
                <button type="button" id="keep-trajectory-toggle" class="quiet-button" aria-pressed="false">Keep trail</button>
                <button type="button" id="obs-mode-toggle" class="quiet-button" aria-pressed="false" title="Reduce preview and 3D rendering load while OBS is recording">OBS mode</button>
                <button type="button" id="new-map-button" class="primary-button">New map</button>
              </div>
            </section>
            <aside class="legend" id="pose-legend"></aside>
          </div>

          <footer class="stage-footer">
            <span>INSIGHT / SPATIAL ENGINE</span>
            <span id="model-status">Models: waiting</span>
          </footer>
        </section>
      </main>
    </div>
    <script type="module" src="/static/pages/spatial.js?v=20260729-compositor-lite"></script>
  </body>
</html>
