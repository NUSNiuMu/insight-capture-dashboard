<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArUco 数采</title><link rel="icon" href="data:,">
<style>
body{font:16px system-ui;background:#f4f6f8;color:#17212c;max-width:1100px;margin:24px auto;padding:0 16px}section{background:white;padding:18px;margin:16px 0;border-radius:10px}button,input,select{font:inherit;padding:7px;margin:4px}button{cursor:pointer}img{width:100%;background:#e5e7eb;aspect-ratio:4/3;object-fit:contain}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#message{color:#b42318;min-height:24px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px;border-bottom:1px solid #ddd}input[type=range]{width:95%}canvas{width:100%;max-width:600px;border:1px solid #ddd}small{color:#596775}
</style>
<h1>ArUco 数采</h1><p>Insight9 VIO · 双臂 cube 定位 · RGB 与夹爪开合度</p>
<div id="message" role="status"></div>
<section><h2>采集</h2><button id="start">开始录制</button><button id="stop">停止录制</button><span id="recording"></span><p id="health"></p><div id="live" class="videos"></div><pre id="arms"></pre></section>
<section><h2>回看与标注</h2><button id="refresh">刷新录制列表</button><select id="sessions"><option value="">选择录制</option></select><p><input id="time" type="range" min="0" max="1" step="0.05" value="0"><span id="seconds">0.00 s</span></p><div id="replay" class="videos"></div>
<p><button id="markStart">设为片段起点</button><input id="from" type="number" min="0" step="0.05" value="0" aria-label="起点秒"><button id="markEnd">设为片段终点</button><input id="to" type="number" min="0" step="0.05" value="1" aria-label="终点秒"></p><input id="task" placeholder="任务文本，例如：拿起杯子" size="35"><button id="add">添加片段</button><button id="save">保存标注</button><table><thead><tr><th>起点 / 秒</th><th>终点 / 秒</th><th>任务</th><th></th></tr></thead><tbody id="segments"></tbody></table></section>
<section><h2>质量与导出</h2><p>有效率以整次录制的预期帧数为分母。导出仅保留标注范围内连续有效的数据；每段末尾观测仅用于生成前一帧动作。</p><button id="qc">计算质量报告</button><button id="export">导出 LeRobot v3</button><table id="quality"></table><p>双臂 TCP 轨迹：XY 平面，单位米。左手蓝色，右手橙色。</p><canvas id="trace" width="600" height="300"></canvas><pre id="result"></pre></section>
<script>
const $=id=>document.getElementById(id);let streams=[],parts=[],records=[];
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||r.statusText);return v}
function action(id,fn){$(id).onclick=async()=>{try{$('message').textContent='';$(id).disabled=true;await fn()}catch(e){$('message').textContent=e.message}finally{$(id).disabled=false}}}
function selected(){const n=$('sessions').value;if(!n)throw Error('请先选择录制');return '/api/sessions/'+encodeURIComponent(n)}
function videos(id,names){$(id).replaceChildren();for(const n of names){const d=document.createElement('div'),label=document.createElement('p'),im=document.createElement('img');label.textContent=n;im.alt=n;im.dataset.stream=n;d.append(label,im);$(id).append(d)}}
async function refresh(){records=await api('/api/sessions');const previous=$('sessions').value;$('sessions').replaceChildren(new Option('选择录制',''));for(const r of records)$('sessions').add(new Option(r.name+' · '+r.status,r.name));$('sessions').value=previous}
function renderParts(){$('segments').replaceChildren();parts.forEach((p,i)=>{const tr=document.createElement('tr');for(const v of [p.start_s,p.end_s,p.task]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='移除';b.onclick=()=>{parts.splice(i,1);renderParts()};td.append(b);tr.append(td);$('segments').append(tr)})}
function replay(){if(!$('sessions').value)return;const t=Number($('time').value);$('seconds').textContent=t.toFixed(2)+' s';for(const im of $('replay').querySelectorAll('img'))im.src=selected()+'/frame/'+encodeURIComponent(im.dataset.stream)+'?t='+t}
function trace(values){const c=$('trace'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const all=Object.values(values).flat();if(!all.length)return;const xs=all.map(p=>p[1]),ys=all.map(p=>p[2]),xmin=Math.min(...xs),ymin=Math.min(...ys),xmax=Math.max(...xs),ymax=Math.max(...ys),scale=Math.min(540/Math.max(xmax-xmin,.1),240/Math.max(ymax-ymin,.1));for(const [side,points]of Object.entries(values)){ctx.strokeStyle=side==='left'?'#1769c2':'#dc710b';ctx.beginPath();points.forEach((p,i)=>{const x=30+(p[1]-xmin)*scale,y=270-(p[2]-ymin)*scale;if(i===0||p[0]-points[i-1][0]>.3)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}ctx.fillStyle='#333';ctx.fillText(`X: ${xmin.toFixed(2)}–${xmax.toFixed(2)} m · Y: ${ymin.toFixed(2)}–${ymax.toFixed(2)} m`,12,16)}
action('start',async()=>{await api('/api/start','POST');await refresh()});action('stop',async()=>{await api('/api/stop','POST');await refresh()});action('refresh',refresh);
$('sessions').onchange=async()=>{try{if(!$('sessions').value)return;parts=await api(selected()+'/segments');renderParts();const r=records.find(r=>r.name===$('sessions').value);$('time').max=r.duration_s;$('to').value=r.duration_s;videos('replay',streams);replay();$('quality').replaceChildren();$('result').textContent=''}catch(e){$('message').textContent=e.message}};
$('time').oninput=replay;$('markStart').onclick=()=>{$('from').value=$('time').value};$('markEnd').onclick=()=>{$('to').value=$('time').value};
action('add',async()=>{const p={start_s:Number($('from').value),end_s:Number($('to').value),task:$('task').value.trim()};if(!p.task||p.start_s>=p.end_s)throw Error('请填写正确的起止时间和任务文本');parts.push(p);parts.sort((a,b)=>a.start_s-b.start_s);renderParts()});
action('save',async()=>{await api(selected()+'/segments','POST',parts);$('message').textContent='标注已保存'});
action('qc',async()=>{const q=await api(selected()+'/qc');$('quality').replaceChildren();for(const [k,v]of Object.entries(q.valid_ratios)){const tr=document.createElement('tr');for(const text of [k,(v*100).toFixed(1)+'%']){const td=document.createElement('td');td.textContent=text;tr.append(td)}$('quality').append(tr)}trace(q.trace);delete q.trace;$('result').textContent=JSON.stringify(q,null,2)});
action('export',async()=>{$('result').textContent='正在导出，请稍候…';const r=await api(selected()+'/export','POST');$('result').textContent=JSON.stringify(r,null,2)});
async function poll(){try{const s=await api('/api/status');if(JSON.stringify(streams)!==JSON.stringify(s.streams)){streams=s.streams;videos('live',streams)}$('recording').textContent=s.recording?`录制中 ${s.elapsed_s.toFixed(1)} s`:'未录制';$('start').disabled=!!s.recording;$('stop').disabled=!s.recording;$('health').textContent=(s.calibrated?'标定就绪':'等待相机标定')+' · '+Object.entries(s.sources_age_s).map(([k,v])=>`${k}: ${v}s 前`).join(' · ');$('arms').textContent=Object.entries(s.arms).map(([name,p])=>name+': '+(p.valid?'有效 · TCP '+p.matrix.slice(0,3).map(r=>r[3].toFixed(3)).join(', ')+' m':p.reason)).join('\n');if(s.error)$('message').textContent=s.error;for(const im of $('live').querySelectorAll('img'))if(s.sources_age_s['image/'+im.dataset.stream]<2)im.src='/api/preview/'+encodeURIComponent(im.dataset.stream)+'?v='+Date.now()}catch(e){$('health').textContent='连接失败：'+e.message}setTimeout(poll,1000)}
refresh().catch(e=>{$('message').textContent=e.message});poll();
</script></html>
